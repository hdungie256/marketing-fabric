source:
  type: deltalake
  serviceName: lake_${LAYER}
  serviceConnection:
    config:
      type: DeltaLake
      configSource:
        connection:
          securityConfig:
            awsAccessKeyId: ${S3_ACCESS_KEY}
            awsSecretAccessKey: ${S3_SECRET_KEY}
            awsRegion: us-east-1
            endPointURL: http://seaweedfs:8333
        bucketName: lake
        prefix: ${LAYER}/
  sourceConfig:
    config:
      type: DatabaseMetadata
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  openMetadataServerConfig:
    hostPort: http://openmetadata-server:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${OM_JWT}
