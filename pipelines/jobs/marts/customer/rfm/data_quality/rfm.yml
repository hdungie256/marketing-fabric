rules:
  - rule_id: customer_id_not_null
    expectation: ExpectColumnValuesToNotBeNull
    kwargs: {column: customer_id}
    severity: critical
  - rule_id: customer_id_unique
    expectation: ExpectColumnValuesToBeUnique
    kwargs: {column: customer_id}
    severity: critical
  - rule_id: recency_score_in_range
    expectation: ExpectColumnValuesToBeBetween
    kwargs: {column: recency_score, min_value: 1, max_value: 5}
    severity: critical
  - rule_id: frequency_score_in_range
    expectation: ExpectColumnValuesToBeBetween
    kwargs: {column: frequency_score, min_value: 1, max_value: 5}
    severity: critical
  - rule_id: monetary_score_in_range
    expectation: ExpectColumnValuesToBeBetween
    kwargs: {column: monetary_score, min_value: 1, max_value: 5}
    severity: critical
