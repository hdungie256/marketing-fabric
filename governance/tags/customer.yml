# Customer-slice classification tags (Story 2.1). Owner: P3, draft for P4 review in 3.5.
# sync_tags() pushes this taxonomy to OM; column assignment lands in Story 3.5.
tags:
  - name: direct_identifier
    classification: Sensitivity
    description: Direct customer identifier (customer_id). Masked or denied per access matrix.
    actions: {default: 'mask:partial', UG02: allow}
  - name: cost_estimate
    classification: Finance
    description: Estimated unit-cost reference. Aggregate-only except UG04 SKU detail.
columns:
  mart_shared.exceptions:
    exception_id: Sensitivity.internal
    class: Sensitivity.internal
    natural_key: Sensitivity.internal
    dataset_id: Sensitivity.internal
    detail: Sensitivity.internal
    detected_at: Sensitivity.internal
    provenance: Sensitivity.internal
    _refreshed_at: Sensitivity.internal
    _run_id: Sensitivity.internal
    _source_version: Sensitivity.internal
  app.exception_status:
    exception_id: Sensitivity.internal
    status: Sensitivity.internal
    updated_at: Sensitivity.internal
    updated_by: Sensitivity.internal
