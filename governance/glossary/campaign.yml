# Campaign-slice glossary terms (Story 1.13, FR-11). Owner: P2.
# Term IDs derive as snake_case(display_name) (AD-16). Provenance is computed, never hand-assigned.
terms:
  - display_name: Attributed Orders
    owner_slice: campaign
    dataset_id: mart_campaign.campaign_overview
    column: attributed_orders
    definition: Orders attributed to a campaign in the period.
    formula: SUM(attributed_orders) of mart_shared.campaign_attributed_daily over the period.
    rules: [R6]
    limitations:
      - Attribution is a source-provided link, not proof the campaign caused the order.
    notes: [attributed_not_incremental]
  - display_name: Attributed Buyers
    owner_slice: campaign
    dataset_id: mart_campaign.campaign_overview
    column: attributed_buyers
    definition: Distinct customers with at least one attributed order in the period.
    formula: COUNT(DISTINCT customer_id) of mart_shared.campaign_attributed_orders over the period.
    rules: [R6]
    limitations:
      - Buyers are not additive across periods or campaigns; the All campaigns row is a distinct count.
    notes: [attributed_not_incremental]
  - display_name: Attributed Gross Value
    owner_slice: campaign
    dataset_id: mart_campaign.campaign_overview
    column: attributed_gross_value
    definition: Gross value of attributed orders in the period.
    formula: SUM(attributed_gross_value) of mart_shared.campaign_attributed_daily over the period.
    rules: [R6, R10]
    limitations:
      - Gross goods value, not net revenue.
    notes: [currency_unverified, attributed_not_incremental]
  - display_name: Average Order Value
    owner_slice: campaign
    dataset_id: mart_campaign.campaign_overview
    column: average_order_value
    definition: Attributed gross value per attributed order in the period.
    formula: attributed_gross_value / attributed_orders, rounded to 2 decimals.
    rules: [R10]
    limitations:
      - Empty when the period has no attributed orders.
    notes: [currency_unverified]
  - display_name: Quantity Sold
    owner_slice: campaign
    dataset_id: mart_campaign.product_sales
    column: quantity
    definition: Units sold in the period.
    formula: SUM(quantity) of unified/order_lines for the selected campaign's attributed orders, or all sales lines for All campaigns.
    rules: [R6]
    limitations:
      - All campaigns includes sales not attributed to any campaign.
    notes: [attributed_not_incremental]
  - display_name: Returning Buyers
    owner_slice: campaign
    dataset_id: mart_campaign.new_returning
    column: returning_buyers
    definition: Attributed buyers in the period whose first observed order was earlier.
    formula: attributed_buyers − first_observed_buyers of mart_campaign.new_returning.
    rules: [R6, R9]
    limitations:
      - "Observed history only: a returning buyer is one seen earlier in 2019."
      - "A buyer whose first observed order is not attributed to the campaign counts as returning there: first observed order is attributed only for first-time buyers of that campaign."
    notes: [first_in_observed_history]
  - display_name: Target Achievement
    owner_slice: campaign
    dataset_id: mart_campaign.target_achievement
    column: achievement
    definition: How far a campaign got toward its own goal.
    formula: "actual / target_value, where actual is the campaign's own target metric summed over its evaluation window. Continue ≥ 100%, Adjust 70% – < 100%, Stop < 70%."
    rules: [R14, R6]
    limitations:
      - Goals were set after the fact for this demo, so achievement is a retrospective reading, not a forecast.
    notes: [retrospective_target, attributed_not_incremental]
